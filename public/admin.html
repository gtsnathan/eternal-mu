<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Eternal MU · Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d0a18;color:#ece6d8;font:14px/1.45 system-ui,'Segoe UI',Roboto,sans-serif}

</style></head><body><div class="wrap" id="app"></div>
<script>
const app=document.getElementById('app');
const api=async(p,b)=>{const r=await fetch('/api/'+p,b===undefined?{}:{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||'Falha'),{status:r.status});return j};

 const stats=[],say=(c,t)=>stats.forEach(x=>{x.className=c;x.textContent=t}),save=async()=>{try{C.settings=(await api('admin/config',{settings:S})).settings;say('msg','Salvo e aplicado no jogo.');setTimeout(()=>say('msg',''),3500)}catch(e){say('err',e.message)}};

 P.rates=el('div',{class:'panel'},el('p',{},el('small',{text:'Multiplicadores globais: 1 é o normal, 2 é o dobro.'})),el('div',{class:'grid'},field('Nível para Reset',S,'resetLevel'),field('Pontos por Reset',S,'resetPoints'),field('Moedas por Reset',S,'resetGold'),field('Itens excelentes',S,'exc'),field('XP',S,'xp'),field('Moedas',S,'gold'),field('Drop de itens',S,'drop'),field('Drop de joias',S,'jewel'),field('Vida dos monstros',S,'hp'),field('Dano dos monstros',S,'dmg'),field('Tempo de respawn',S,'respawn')));
 const t=el('input',{type:'checkbox'});t.checked=S.test;t.onchange=()=>S.test=t.checked;P.rates.append(el('p',{},el('label',{style:'display:flex;gap:8px;align-items:center;color:inherit;font-size:14px'},t,'Permitir o comando /teste (desligue ao abrir ao público)')),saveBar());
 const tb=el('tbody');for(const m of C.defaults.mobs){const o=S.mobs[m.key]??={};const n=(f,d)=>{const i=el('input',{type:'number',step:'any',value:o[f]??'',placeholder:String(d)});i.oninput=()=>{if(i.value==='')delete o[f];else o[f]=+i.value};return el('td',{},i)};tb.append(el('tr',{},el('td',{text:m.name+' (Nv '+m.level+')'}),n('hp',m.hp),n('dmg',m.dmg),n('def',m.def),n('xp',m.xp),n('respawnMs',m.respawnMs),n('drop',1)))}
 P.mobs=el('div',{class:'panel'},el('p',{},el('small',{text:'Vazio usa o valor padrão, mostrado em cinza.'})),el('div',{class:'scroll'},el('table',{},el('thead',{},el('tr',{},...['Monstro','Vida','Dano','Defesa','XP','Respawn (ms)','Drop ×'].map(x=>el('th',{text:x})))),tb)),saveBar());
 const nm={jewel_aurora:'Joia da Aurora',jewel_destiny:'Joia do Destino',jewel_eclipse:'Joia do Eclipse'},jg=el('div',{class:'grid'});for(const k in C.defaults.jewels){const i=el('input',{type:'number',min:0,max:100,step:1,value:S.jewels[k]==null?'':Math.round(S.jewels[k]*100),placeholder:Math.round(C.defaults.jewels[k]*100)+'%'});i.oninput=()=>{if(i.value==='')delete S.jewels[k];else S.jewels[k]=+i.value/100};jg.append(el('div',{},el('label',{text:nm[k]+': chance (%)'}),i))}
 P.jew=el('div',{class:'panel'},jg,saveBar());
 const q=el('input',{placeholder:'Buscar por personagem ou conta'}),res=el('div',{class:'scroll'}),st=el('span',{class:'msg'});

 q.oninput=()=>{clearTimeout(q.t);q.t=setTimeout(search,250)};P.play=el('div',{class:'panel'},q,el('div',{class:'bar'},st),res);
 const nt=el('input',{placeholder:'Mensagem para todos os jogadores',maxlength:200}),ns=el('span',{class:'msg'});P.news=el('div',{class:'panel'},nt,el('div',{class:'bar'},el('button',{class:'main',text:'Enviar',onclick:async()=>{try{await api('admin/announce',{m:nt.value});nt.value='';ns.className='msg';ns.textContent='Enviado.'}catch(e){ns.className='err';ns.textContent=e.message}}}),ns));
 const lg=el('div',{class:'scroll'});P.log=el('div',{class:'panel'},lg);const loadLog=async()=>{const{log}=await api('admin/log');lg.replaceChildren(el('table',{},el('tbody',{},...log.map(x=>el('tr',{},el('td',{text:new Date(x.at).toLocaleString('pt-BR')}),el('td',{text:x.username}),el('td',{text:x.action}),el('td',{text:(x.detail||'').slice(0,90)}))))))};

 app.replaceChildren(el('div',{class:'top'},el('h1',{text:'Eternal MU · Admin'}),el('a',{href:'/jogar',style:'color:#e9c46a',text:'Voltar ao jogo'})),tabBar,...Object.values(P));show('rates')}
boot();
</script></body></html>
